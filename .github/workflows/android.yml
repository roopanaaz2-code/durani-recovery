name: Build Durani Recovery APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584m -Dorg.gradle.parallel=false -Dorg.gradle.configuration-cache=false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          # Use pre-installed Android SDK on GitHub Actions runner
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          # Accept all licenses
          yes | sdkmanager --licenses || true
          
          # Install compileSdk 36 / 36.1 and build tools required by AGP
          sdkmanager --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Prepare Secrets & Debug Keystore
        run: |
          # Ensure .env exists so secrets-gradle-plugin succeeds
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # Fallback: Generate a fresh standard debug keystore if missing or empty
          if [ ! -s debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Durani-Recovery-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk durani-recovery.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Durani Recovery v1.0.${{ github.run_number }} (Direct APK)"
          body: |
            ### 📱 Download & Install Durani Recovery
            Click **`durani-recovery.apk`** below to download and install directly on your Android phone (no unzipping required!).
          files: durani-recovery.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
